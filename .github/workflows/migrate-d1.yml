name: Migrate Lunchie D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to run production D1 migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lunchie-d1-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 migrations
    # Until the repository's production environment has required reviewers,
    # production migrations remain owner-operated. Contributors can submit a
    # migration in a PR but cannot execute it against lunchie-db.
    if: github.event.inputs.confirmation == 'APPLY' && github.actor == 'JP5635'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply pending migrations to lunchie-db
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATIONS_TOKEN }}
        run: pnpm cf:d1:migrate
