name: Deploy Cloudflare production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm run test:precommit

      # Schema first: application deployments may depend on the new columns.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply lunchie-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATIONS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Durable Object state worker
        run: pnpm exec wrangler deploy --config wrangler.state.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Pages runtime maps secret
        run: |
          node -e "if (!process.env.GOOGLE_MAPS_SERVER_API_KEY) throw new Error('Missing GOOGLE_MAPS_SERVER_API_KEY in GitHub production secrets')"
          printf '%s' "$GOOGLE_MAPS_SERVER_API_KEY" | pnpm exec wrangler pages secret put GOOGLE_MAPS_SERVER_API_KEY --project-name=lunchie-munchie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}

      - name: Build and deploy Pages
        run: |
          node -e "if (!process.env.VITE_GOOGLE_MAPS_API_KEY) throw new Error('Missing VITE_GOOGLE_MAPS_API_KEY in GitHub production secrets or variables')"
          pnpm exec vite build
          pnpm exec wrangler pages deploy dist/public --project-name=lunchie-munchie --branch=main --commit-dirty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Vite embeds the browser-restricted Maps key at build time. The
          # Cloudflare runtime secret alone cannot reach the GitHub runner.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || vars.VITE_GOOGLE_MAPS_API_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # Keep the Next.js-compatible name available for the planned client
          # migration without removing the current Vite build variable.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
